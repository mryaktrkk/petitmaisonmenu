DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petit Maison - Café & Kids Play Dijital Menü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2E5A44; 
            --light-green: #EAF2EE;
            --accent-cream: #FDFBF7;
            --text-dark: #1A2620;
            --text-muted: #60756B;
            --bear-brown: #BC8F60; 
            --bear-light: #F3E1CE;
            --bear-shirt: #E8B4B8; 
            --border-color: #D1DEC7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--accent-cream);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .bear-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 35px;
            position: relative;
            height: 110px;
        }

        .bear-character {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .bear-character::before, .bear-character::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: var(--bear-brown);
            border-radius: 50%;
            top: -5px;
        }
        .bear-character::before { left: 4px; box-shadow: inset -3px -2px 0 var(--bear-light); }
        .bear-character::after { right: 4px; box-shadow: inset 3px -2px 0 var(--bear-light); }

        .bear-head-main {
            position: absolute;
            width: 80px;
            height: 70px;
            background-color: var(--bear-brown);
            border-radius: 50% 50% 46% 46%;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .bear-eyes {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #332211;
            border-radius: 50%;
            top: 26px;
            left: 22px;
            box-shadow: 30px 0 0 #332211;
        }
        .bear-cheeks {
            position: absolute;
            width: 10px;
            height: 6px;
            background-color: #FFAAA6;
            border-radius: 50%;
            top: 32px;
            left: 12px;
            opacity: 0.7;
            box-shadow: 46px 0 0 #FFAAA6;
        }

        .bear-snout {
            position: absolute;
            width: 34px;
            height: 24px;
            background-color: var(--bear-light);
            border-radius: 50%;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
        .bear-snout::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 6px;
            background-color: #332211;
            border-radius: 50%;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
